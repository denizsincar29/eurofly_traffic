[project]
name = "eurofly-traffic"
version = "0.3.0"
description = "Library for interacting with Eurofly traffic data"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.2",
    "httpx>=0.28.1",
    "pydantic>=2.0.0",
    "mcp[cli]>=1.0.0",
    "wxPython>=4.2.0",
]

[project.scripts]
eurofly-mcp-server = "mcp_server:mcp.run"
eurofly-gui = "eurofly_gui:main"
